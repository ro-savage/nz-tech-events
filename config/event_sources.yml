# Organiser listing pages that techevents.co.nz events have come from.
#
# Each source is a page where an organiser lists many events (Humanitix host,
# Meetup group, Luma calendar, Eventbrite organiser, or their own /events page),
# so it can be re-checked for new events instead of waiting for the Google Sheet.
# Built by matching every live event's registration_url back to its organiser.
#
# Fields:
#   name       shown publicly as the "Source:" link on event pages, so keep it a
#              plain organiser name (put context in notes, not in brackets here)
#   url        page a person would browse
#   platform   how the page is built (decides how to read it)
#   feed       machine-readable endpoint, where one was found and tested
#   also       other pages from the same organiser (secondary platform, regional groups)
#   filter     the listing includes non-tech or non-NZ events that need filtering out
#   status     active = upcoming events on 2026-10-06; quiet = none upcoming;
#              unknown = page has no dates; unverified = couldn't load it (Cloudflare/JS)
#   upcoming   upcoming events counted on 2026-10-06
#   site_event_ids  techevents.co.nz event ids that came from this organiser
#
# no_listing records events checked and found to have no multi-event page
# (one-off conferences, informal meetups with no URL), so they aren't re-researched.

